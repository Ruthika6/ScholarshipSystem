<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <h1>🎓 Scholarship System</h1>
    <div>
        <a href="/">Students</a>
        <a href="/scholarships">Scholarships</a>
        <a href="/applications">Applications</a>
        <a href="/disbursements">Disbursements</a>
    </div>
</nav>

<div class="container">

<div class="card">
<h2>Add Student</h2>

<form method="POST" action="/">
    <input type="text" name="id" placeholder="Student ID" required>
    <input type="text" name="name" placeholder="Name" required>
    <input type="text" name="dept" placeholder="Dept ID">
    <input type="text" name="year" placeholder="Year">
    <input type="text" name="cgpa" placeholder="CGPA">
    <input type="text" name="income" placeholder="Income">
    <button type="submit">Add Student</button>
</form>
</div>

<div class="card">
<h2>Student List</h2>

<table>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Dept</th>
    <th>Year</th>
    <th>CGPA</th>
    <th>Income</th>
</tr>

{% for s in students %}
<tr>
    <td>{{s.Student_ID}}</td>
    <td>{{s.Name}}</td>
    <td>{{s.Dept_ID}}</td>
    <td>{{s.Year}}</td>
    <td>{{s.CGPA}}</td>
    <td>{{s.Family_Income}}</td>
</tr>
{% endfor %}
</table>
</div>

</div>

</body>
</html>
